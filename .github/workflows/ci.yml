name: Continuous Integration

on: 
  pull_request:
    branches:
      - master

jobs:
  test:
    runs_on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: ['v26.13.0']

    services:
      postgres:
        image: postgres
        env:
         POSTGRES_USER: fathony
         POSTGRES_PASSWORD: noname7562
         POSTGRES_DB: authapi
         
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
 
    steps:
    - uses: actions/checkout@v2
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v2
      with:
        node-version: ${{ matrix.node-version }}
    - name: npm install migrate and test
      run: |
        npm ci
        npm run migrate up
        npm run test
      env:
        CI: true
        HOST: localhost
        PORT: 3000
        PGHOST: localhost
        PGPORT: 5432
        PGUSER: fathony
        PGPASSWORD: noname7562
        PGDATABASE: authapi
        ACCESS_TOKEN_KEY: secret
        REFRESH_TOKEN_KEY: terces
        ACCESS_TOKEN_AGE: 3600